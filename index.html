<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sing Song Write</title>
    <script src="https://cdn.jsdelivr.net/npm/vexflow@4.2.2/build/cjs/vexflow.js"></script>
    <style>
        :root { --navy: #000080; --red: #c0392b; --orange: #ff8c00; --lime: #32cd32; }
        body { font-family: sans-serif; margin: 0; background: #fff; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        
        /* 2. 상단 타이틀 및 설정 */
        header { width: 100%; padding: 10px 0; border-bottom: 1px solid #eee; flex-shrink: 0; display: flex; flex-direction: column; align-items: center; }
        .title-row { display: flex; align-items: center; gap: 10px; margin-bottom: 5px; }
        h1 { font-size: 1.1rem; margin: 0; color: var(--navy); }
        #status-display { font-weight: bold; color: var(--red); font-size: 0.9rem; min-width: 60px; }
        .settings { font-size: 0.8rem; color: #888; }

        /* 1, 3. 악보 컨테이너 가로폭 최적화 및 크기 축소 */
        #score-wrapper { 
            position: relative; flex: 1; width: 100%; background: white; 
            overflow-y: auto; overflow-x: hidden;
        }
        #score-render-area { width: 100%; min-width: 320px; }
        
        #playhead { 
            position: absolute; width: 2px; height: 60px; background: #ddd; z-index: 50; display: none;
            transition: background 0.05s;
        }
        #playhead.first-beat { background: var(--orange) !important; box-shadow: 0 0 10px var(--orange); }
        #playhead.other-beat { background: var(--lime) !important; box-shadow: 0 0 10px var(--lime); }

        /* 4. 하단 버튼 크기 축소 및 재생 버튼 추가 */
        .bottom-controls { 
            display: flex; gap: 5px; padding: 10px; background: #f1f3f5; 
            border-top: 1px solid #ddd; padding-bottom: calc(10px + env(safe-area-inset-bottom));
        }
        .small-btn { flex: 1; padding: 10px 0; font-size: 0.85rem; font-weight: bold; border: none; border-radius: 6px; color: white; cursor: pointer; }
        #rec-btn { background: var(--navy); }
        #stop-btn { background: var(--red); display: none; }
        #play-btn { background: #27ae60; }
        #del-btn { background: #666; flex: 0 0 50px; }

        footer { padding: 5px; text-align: center; font-size: 0.8rem; color: #ccc; }
    </style>
</head>
<body>

    <header>
        <div class="title-row">
            <h1>SING SONG Write</h1>
            <div id="status-display">READY</div>
        </div>
        <div class="settings">
            BPM <input type="number" id="bpm-input" value="80" style="width:35px; border:none; border-bottom:1px solid #ccc;">
            (4마디 정렬)
        </div>
    </header>

    <div id="score-wrapper">
        <div id="playhead"></div>
        <div id="score-render-area"></div>
    </div>

    <div class="bottom-controls">
        <button id="del-btn" class="small-btn" onclick="deleteLast()">←</button>
        <button id="rec-btn" class="small-btn" onclick="startRecording()">RECORD</button>
        <button id="stop-btn" class="small-btn" onclick="stopRecording()">STOP</button>
        <button id="play-btn" class="small-btn" onclick="playbackMelody()">PLAY</button>
    </div>

    <footer>SONG, YOUNG-MIN Guitar Lab</footer>

    <script>
        let audioCtx, analyser, isRecording = false;
        let bpm, beatSec, timeSig = 4;
        let recordedNotes = [];
        let startTime, recognition;
        const noteNames = ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B"];
        let lastTranscript = "";

        // 5. 가사 인식 속도 개선 (InterimResults 활용)
        function setupSpeech() {
            const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (SpeechRec) {
                recognition = new SpeechRec();
                recognition.continuous = true;
                recognition.interimResults = true;
                recognition.lang = 'ko-KR';
                recognition.onresult = (e) => {
                    for (let i = e.resultIndex; i < e.results.length; i++) {
                        let word = e.results[i][0].transcript.trim().split(' ').pop();
                        lastTranscript = word; // 가장 마지막 인식 단어를 즉시 보관
                    }
                };
            }
        }

        async function startRecording() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                analyser = audioCtx.createAnalyser();
                analyser.fftSize = 1024; // 분석창을 줄여 반응속도 향상
                audioCtx.createMediaStreamSource(stream).connect(analyser);
            }
            setupSpeech();
            bpm = document.getElementById('bpm-input').value;
            beatSec = 60 / bpm;
            isRecording = true; 
            document.getElementById('rec-btn').style.display = 'none';
            document.getElementById('stop-btn').style.display = 'inline-block';
            document.getElementById('playhead').style.display = 'block';
            if(recognition) recognition.start();
            startTime = audioCtx.currentTime;
            updateLoop();
        }

        function stopRecording() {
            isRecording = false;
            if(recognition) recognition.stop();
            document.getElementById('rec-btn').style.display = 'inline-block';
            document.getElementById('stop-btn').style.display = 'none';
        }

        function updateLoop() {
            if (!isRecording) return;
            const totalBeats = (audioCtx.currentTime - startTime) / beatSec;
            movePlayhead(totalBeats);
            detectPitch(totalBeats);
            requestAnimationFrame(updateLoop);
        }

        // 1. 가로폭 비율 보정 로직
        function movePlayhead(beat) {
            const head = document.getElementById('playhead');
            const mIdx = Math.floor(beat / timeSig);
            const line = Math.floor(mIdx / 4);
            const col = mIdx % 4;
            
            // 4마디가 가로폭 100%에 꽉 차도록 계산
            const areaWidth = window.innerWidth;
            const step = areaWidth / 4; 
            
            head.style.left = `${(col * step) + ((beat % timeSig) / timeSig * step)}px`;
            head.style.top = `${15 + (line * 90)}px`; // 3. 행간 단축

            const bDec = beat % 1;
            if (bDec < 0.2) {
                head.className = (Math.floor(beat % timeSig) === 0) ? 'first-beat' : 'other-beat';
            } else { head.className = ''; }
        }

        let lastNoteName = "", noteStart = 0;
        function detectPitch(currentBeat) {
            const buffer = new Float32Array(analyser.fftSize);
            analyser.getFloatTimeDomainData(buffer);
            const freq = getPitch(buffer, audioCtx.sampleRate);

            if (freq !== -1) {
                const info = getNoteInfo(freq);
                const name = info.key + info.octave;
                if (lastNoteName === "") {
                    noteStart = Math.round(currentBeat * 4) / 4; // 16분음표 단위로 더 정밀하게
                    lastNoteName = name;
                }
            } else if (lastNoteName !== "") {
                const duration = Math.round(currentBeat * 4) / 4 - noteStart;
                if (duration >= 0.25) {
                    const info = getNoteInfoFromID(lastNoteName);
                    recordedNotes.push({ ...info, startBeat: noteStart, type: duration >= 0.7 ? "q" : "8", lyric: lastTranscript });
                    drawScore();
                    lastTranscript = ""; // 가사 입력 후 초기화
                }
                lastNoteName = "";
            }
        }

        // 4. 멜로디 재생 기능
        function playbackMelody() {
            if (recordedNotes.length === 0) return;
            const now = audioCtx.currentTime;
            recordedNotes.forEach(n => {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                const freq = 440 * Math.pow(2, (getMidiNum(n) - 69) / 12);
                
                osc.frequency.value = freq;
                osc.type = "sine";
                gain.gain.setValueAtTime(0.2, now + n.startBeat * beatSec);
                gain.gain.exponentialRampToValueAtTime(0.001, now + (n.startBeat + 0.5) * beatSec);
                
                osc.connect(gain).connect(audioCtx.destination);
                osc.start(now + n.startBeat * beatSec);
                osc.stop(now + (n.startBeat + 0.5) * beatSec);
            });
        }

        function getMidiNum(n) {
            const idx = noteNames.indexOf(n.key + (n.accidental || ""));
            return (n.octave + 1) * 12 + idx;
        }

        function drawScore() {
            const area = document.getElementById('score-render-area');
            area.innerHTML = "";
            const VF = Vex.Flow;
            const renderer = new VF.Renderer(area, VF.Renderer.Backends.SVG);
            let measures = [];
            recordedNotes.forEach(n => {
                const mIdx = Math.floor(n.startBeat / timeSig);
                if(!measures[mIdx]) measures[mIdx] = [];
                measures[mIdx].push(n);
            });
            const totalM = Math.max(measures.length, 4);
            const rows = Math.ceil(totalM / 4);
            const areaWidth = window.innerWidth;
            const step = areaWidth / 4;

            renderer.resize(areaWidth, rows * 90 + 30);
            const ctx = renderer.getContext();
            ctx.scale(0.65, 0.65); // 3. 오선지 및 음표 크기 대폭 축소

            for (let i = 0; i < totalM; i++) {
                const r = Math.floor(i / 4), c = i % 4;
                const sW = step / 0.65;
                const stave = new VF.Stave(c * sW, r * (90/0.65), sW);
                if (c === 0) stave.addClef("treble");
                stave.setContext(ctx).draw();

                if (measures[i]) {
                    const notes = measures[i].map(d => {
                        const sn = new VF.StaveNote({ keys: [`${d.key}/${d.octave}`], duration: d.type });
                        if (d.accidental) sn.addModifier(new VF.Accidental(d.accidental));
                        sn.addModifier(new VF.Annotation(d.key).setVerticalJustification(VF.Annotation.VerticalJustify.TOP));
                        if (d.lyric) sn.addModifier(new VF.Annotation(d.lyric).setVerticalJustification(VF.Annotation.VerticalJustify.BOTTOM));
                        return sn;
                    });
                    const voice = new VF.Voice({ num_beats: 4, beat_value: 4 }).setStrict(false);
                    voice.addTickables(notes);
                    new VF.Formatter().joinVoices([voice]).format([voice], sW - 20);
                    voice.draw(ctx, stave);
                }
            }
        }

        // --- 유틸리티 함수 (초기 버전 로직 복구) ---
        function getPitch(buf, sampleRate) {
            let sum = 0; for (let i=0; i<buf.length; i++) sum += buf[i]*buf[i];
            if (Math.sqrt(sum/buf.length) < 0.02) return -1;
            let bestOffset = -1, bestCorrelation = 0;
            for (let offset = 20; offset < 500; offset++) {
                let corr = 0;
                for (let i=0; i<buf.length-offset; i++) corr += Math.abs(buf[i]-buf[i+offset]);
                corr = 1 - (corr/buf.length);
                if (corr > bestCorrelation) { bestCorrelation = corr; bestOffset = offset; }
            }
            return (bestCorrelation > 0.85) ? sampleRate/bestOffset : -1;
        }

        function getNoteInfo(freq) {
            const num = 12 * (Math.log2(freq / 440)) + 69;
            const rnd = Math.round(num);
            let oct = Math.floor(rnd / 12) - 1;
            if (oct < 4) oct += 1;
            return { key: noteNames[rnd % 12].replace('#',''), octave: oct, accidental: noteNames[rnd % 12].includes('#') ? '#' : null };
        }

        function getNoteInfoFromID(id) {
            const key = id.slice(0, -1);
            const oct = parseInt(id.slice(-1));
            return { key, octave: oct, accidental: key.includes('#') ? '#' : null };
        }

        function deleteLast() { recordedNotes.pop(); drawScore(); }
    </script>
</body>
</html>
