<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Live Score Mobile - SYMGuitarLab</title>
    <script src="https://cdn.jsdelivr.net/npm/vexflow@4.2.2/build/cjs/vexflow.js"></script>
    <style>
        :root { --navy: #001f3f; --red: #ff4136; --bg: #1a1a1a; --stave: #ffffff; }
        
        * { box-shadow: none !important; -webkit-tap-highlight-color: transparent; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; background: var(--bg); color: white; overflow: hidden; height: 100vh; display: flex; flex-direction: column; }
        
        /* 모바일 헤더 및 상단 컨트롤 */
        header { padding: 10px 15px; background: rgba(0,0,0,0.8); backdrop-filter: blur(5px); z-index: 100; border-bottom: 1px solid #333; }
        .top-bar { display: flex; justify-content: space-between; align-items: center; }
        h1 { font-size: 1.1rem; margin: 0; color: #aaa; }
        #watermark-mini { font-size: 0.8rem; color: rgba(255,255,255,0.3); font-weight: bold; }

        .settings-bar { display: flex; gap: 10px; margin-top: 8px; justify-content: center; font-size: 0.9rem; }
        input, select { background: #333; color: white; border: 1px solid #555; padding: 5px; border-radius: 4px; font-size: 0.9rem; }

        /* 악보 뷰포트 (현재 줄만 표시) */
        #score-viewport { position: relative; flex: 1; background: var(--stave); overflow: hidden; width: 100%; }
        #score-render-area { position: absolute; top: 0; left: 0; transform-origin: top left; transition: transform 0.2s ease-out; }
        
        /* 플레이헤드 및 통합 LED */
        #playhead-container { position: absolute; top: 0; left: 0; height: 100%; width: 2px; background: rgba(255, 65, 54, 0.8); z-index: 50; display: none; pointer-events: none; }
        
        /* 플레이헤드를 따라다니는 초소형 LED */
        #follower-led { position: absolute; top: 10px; left: -15px; width: 30px; height: 6px; background: #444; border-radius: 3px; border: 1px solid rgba(255,255,255,0.2); transition: background 0.05s; }
        #follower-led.active { background: #00ff00; box-shadow: 0 0 8px #00ff00; }
        #follower-led.downbeat { background: #ff00ff; box-shadow: 0 0 8px #ff00ff; }

        /* 하단 모바일 컨트롤 바 */
        .bottom-controls { display: flex; padding: 15px; gap: 10px; background: rgba(0,0,0,0.9); border-top: 1px solid #333; padding-bottom: calc(15px + env(safe-area-inset-bottom)); }
        .mobile-btn { flex: 1; padding: 18px; font-size: 1.2rem; font-weight: bold; border: none; border-radius: 12px; color: white; cursor: pointer; transition: opacity 0.1s; text-transform: uppercase; }
        .mobile-btn:active { opacity: 0.7; }
        
        #rec-btn { background: var(--red); }
        #stop-btn { background: #555; display: none; }
        #del-btn { background: #333; color: #aaa; flex: 0 0 60px; font-size: 1.5rem; padding: 18px 0; }

        #status { position: absolute; bottom: 85px; left: 0; width: 100%; text-align: center; font-size: 0.8rem; color: #888; pointer-events: none; z-index: 90; }
    </style>
</head>
<body>

    <header>
        <div class="top-bar">
            <h1>Live Score</h1>
            <div id="watermark-mini">S.Y.M Guitar Lab</div>
        </div>
        <div class="settings-bar">
            <span>BPM: <input type="number" id="bpm-input" value="80" style="width:50px;"></span>
            <span>박자: 
                <select id="time-sig">
                    <option value="4/4">4/4</option>
                    <option value="3/4">3/4</option>
                </select>
            </span>
        </div>
    </header>

    <div id="score-viewport">
        <div id="playhead-container">
            <div id="follower-led"></div>
        </div>
        <div id="score-render-area"></div>
    </div>
    
    <div id="status">대기 중...</div>

    <div class="bottom-controls">
        <button id="del-btn" class="mobile-btn" onclick="deleteLast()">←</button>
        <button id="rec-btn" class="mobile-btn" onclick="startRecording()">RECORD</button>
        <button id="stop-btn" class="mobile-btn" onclick="stopRecording()">STOP</button>
    </div>

    <script>
        let audioCtx, analyser, isRecording = false;
        let bpm, beatSec, timeSig = 4, measuresPerLine = 2; // 모바일은 한줄에 2마디가 적당
        let recordedNotes = [];
        let startTime, currentLine = -1;
        const noteNames = ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B"];
        const STAVE_WIDTH = 350; // 마디 너비 (고정)

        async function startRecording() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                audioCtx.createMediaStreamSource(stream).connect(analyser = audioCtx.createAnalyser());
            }
            
            bpm = document.getElementById('bpm-input').value;
            beatSec = 60 / bpm;
            timeSig = parseInt(document.getElementById('time-sig').value.split('/')[0]);
            
            // 모바일 화면 방향에 따라 마디 수 조정
            measuresPerLine = window.innerWidth > window.innerHeight ? 4 : 2;

            isRecording = true;
            document.getElementById('rec-btn').style.display = 'none';
            document.getElementById('stop-btn').style.display = 'block';
            document.getElementById('playhead-container').style.display = 'block';
            document.getElementById('status').innerText = "녹음 중...";

            startTime = audioCtx.currentTime;
            currentLine = -1; 
            requestAnimationFrame(updateLoop);
        }

        function stopRecording() {
            isRecording = false;
            document.getElementById('rec-btn').style.display = 'block';
            document.getElementById('stop-btn').style.display = 'none';
            document.getElementById('playhead-container').style.display = 'none';
            document.getElementById('status').innerText = "정지됨.";
        }

        let lastPitch = -1, noteStartBeat = 0;

        function updateLoop() {
            if (!isRecording) return;

            const now = audioCtx.currentTime - startTime;
            const currentBeat = now / beatSec;
            
            // 1. 플레이헤드 및 팔로워 LED 업데이트
            updatePlayhead(currentBeat);

            // 2. 음높이 및 박자 분석 (퀀타이즈)
            const buffer = new Float32Array(analyser.fftSize);
            analyser.getFloatTimeDomainData(buffer);
            const freq = autoCorrelate(buffer, audioCtx.sampleRate);

            if (freq !== -1) {
                if (lastPitch === -1) {
                    // 음 시작 - 8분음표 그리드(0.5박)에 퀀타이즈
                    noteStartBeat = Math.round(currentBeat * 2) / 2;
                    lastPitch = getNoteFromFreq(freq);
                }
            } else if (lastPitch !== -1) {
                // 음 종료
                const noteEndBeat = Math.round(currentBeat * 2) / 2;
                const duration = noteEndBeat - noteStartBeat;
                
                if (duration >= 0.5) { // 최소 8분음표 길이 이상일 때만 기록
                    addNote(lastPitch, noteStartBeat, duration);
                }
                lastPitch = -1;
            }

            requestAnimationFrame(updateLoop);
        }

        function updatePlayhead(beat) {
            const container = document.getElementById('playhead-container');
            const led = document.getElementById('follower-led');
            const renderArea = document.getElementById('score-render-area');
            
            const currentMeasure = Math.floor(beat / timeSig);
            const beatInMeasure = beat % timeSig;
            const line = Math.floor(currentMeasure / measuresPerLine);
            const col = currentMeasure % measuresPerLine;
            
            // 플레이헤드 X 위치 계산
            const xPos = 60 + (col * STAVE_WIDTH) + (beatInMeasure / timeSig * STAVE_WIDTH);
            container.style.left = `${xPos}px`;
            
            // LED 상태 업데이트 (강박/약박 깜빡임)
            const isDownbeat = Math.floor(beatInMeasure) === 0;
            const isBeat = (beat % 1) < 0.1; // 박자 경계에서 짧게 깜빡임
            
            led.classList.toggle('active', isBeat && !isDownbeat);
            led.classList.toggle('downbeat', isBeat && isDownbeat);

            // 중요: 모바일 자동 뷰포트 스크롤 (줄이 바뀌면 악보 영역을 위로 올림)
            if (line !== currentLine) {
                currentLine = line;
                const yOffset = line * 150; // 줄당 높이
                renderArea.style.transform = `translateY(-${yOffset}px)`;
                drawScore(); // 줄 바뀔 때 악보를 새로 그려서 뷰포트에 맞춤
            }
        }

        function addNote(pitch, startBeat, duration) {
            // 박자 제한: 4분음표(q)와 8분음표(8)로만 퀀타이즈
            let type = "q";
            if (duration < 0.75) type = "8"; // 0.75박 미만은 8분음표
            else type = "q"; // 그 이상은 4분음표로 간략화

            recordedNotes.push({ ...pitch, startBeat, type });
            drawScore();
        }

        function deleteLast() {
            recordedNotes.pop();
            drawScore();
        }

        function drawScore() {
            const area = document.getElementById('score-render-area');
            area.innerHTML = "";
            const VF = Vex.Flow;
            const renderer = new VF.Renderer(area, VF.Renderer.Backends.SVG);
            
            // 마디별 데이터 분리
            let measures = [];
            recordedNotes.forEach(n => {
                const mIdx = Math.floor(n.startBeat / timeSig);
                if(!measures[mIdx]) measures[mIdx] = [];
                measures[mIdx].push(n);
            });

            // 현재 녹음 중인 줄까지만 캔버스 크기 확보
            const totalLinesRequested = Math.max(currentLine + 1, 1);
            const totalMeasuresNeeded = totalLinesRequested * measuresPerLine;
            
            // 모바일 화면 폭에 맞춰 스케일링 (가변)
            const viewportWidth = window.innerWidth;
            const requiredWidth = STAVE_WIDTH * measuresPerLine + 80;
            const scale = viewportWidth / requiredWidth;
            document.getElementById('score-render-area').style.transform = `translateY(-${currentLine * 150}px) scale(${scale})`;

            renderer.resize(requiredWidth, totalLinesRequested * 150 + 50);
            const ctx = renderer.getContext();
            ctx.setFont("Arial", 10, "").setBackgroundFillStyle("#fff");

            for (let i = 0; i < totalMeasuresNeeded; i++) {
                const row = Math.floor(i / measuresPerLine);
                const col = i % measuresPerLine;
                
                // 현재 뷰포트에 보이는 줄만 그림 (성능 최적화)
                if (row < currentLine || row > currentLine) continue;

                const stave = new VF.Stave(col * STAVE_WIDTH + 60, row * 150 + 20, STAVE_WIDTH);
                if (col === 0) stave.addClef("treble");
                if (i === 0) stave.addTimeSignature(document.getElementById('time-sig').value);
                stave.setContext(ctx).draw();

                if (measures[i]) {
                    const vfNotes = measures[i].map(d => {
                        const sn = new VF.StaveNote({ keys: [`${d.key}/${d.octave}`], duration: d.type });
                        if (d.accidental) sn.addModifier(new VF.Accidental(d.accidental));
                        return sn;
                    });
                    const voice = new VF.Voice({ num_beats: timeSig, beat_value: 4 }).setStrict(false);
                    voice.addTickables(vfNotes);
                    new VF.Formatter().joinVoices([voice]).format([voice], STAVE_WIDTH - 50);
                    voice.draw(ctx, stave);
                }
            }
        }

        // 창 크기 변경(방향 전환) 시 악보 다시 그리기
        window.addEventListener('resize', () => {
            if(isRecording) {
                measuresPerLine = window.innerWidth > window.innerHeight ? 4 : 2;
                drawScore();
            }
        });

        // --- 분석 엔진 (기존 동일) ---
        function getNoteFromFreq(freq) {
            const num = 12 * (Math.log2(freq / 440)) + 69;
            const rnd = Math.round(num);
            return { key: noteNames[rnd % 12].replace('#',''), octave: Math.floor(rnd / 12) + 1, accidental: noteNames[rnd % 12].includes('#') ? '#' : null };
        }

        function autoCorrelate(buf, sampleRate) {
            let rms = 0; for (let i=0; i<buf.length; i++) rms += buf[i]*buf[i];
            if (Math.sqrt(rms/buf.length) < 0.02) return -1;
            let c = new Array(buf.length).fill(0);
            for (let i=0; i<buf.length; i++) for (let j=0; j<buf.length-i; j++) c[i] = c[i] + buf[j]*buf[j+i];
            let d=0; while (c[d]>c[d+1]) d++;
            let maxv=-1, maxp=-1;
            for (let i=d; i<buf.length; i++) if (c[i] > maxv) { maxv = c[i]; maxp = i; }
            return sampleRate/maxp;
        }
    </script>
</body>
</html>
