<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Live Recording Score - SYMGuitarLab</title>
    <script src="https://cdn.jsdelivr.net/npm/vexflow@4.2.2/build/cjs/vexflow.js"></script>
    <style>
        :root { --navy: #000080; --red: #c0392b; --gold: #f39c12; }
        body { font-family: 'Segoe UI', sans-serif; margin: 0; background: #ececec; display: flex; flex-direction: column; align-items: center; }
        
        #watermark { position: fixed; top: 20px; right: 30px; font-size: 1.2rem; font-weight: 800; color: rgba(0,0,0,0.1); pointer-events: none; }
        
        header { width: 100%; background: #2c3e50; color: white; padding: 20px 0; text-align: center; box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
        
        /* 대형 버튼 및 컨트롤 */
        .main-controls { display: flex; gap: 20px; justify-content: center; margin-top: 20px; }
        .big-btn { 
            padding: 20px 40px; font-size: 1.5rem; font-weight: bold; border: none; border-radius: 12px; 
            cursor: pointer; transition: transform 0.1s, background 0.3s; color: white;
            box-shadow: 0 6px 0 rgba(0,0,0,0.2);
        }
        .big-btn:active { transform: translateY(4px); box-shadow: 0 2px 0 rgba(0,0,0,0.2); }
        
        #rec-btn { background: var(--red); }
        #pause-btn { background: var(--gold); display: none; }
        #del-btn { background: #7f8c8d; font-size: 1.1rem; }

        .settings { margin: 15px; font-size: 1.2rem; display: flex; gap: 20px; align-items: center; }
        input, select { font-size: 1.1rem; padding: 8px; border-radius: 5px; border: none; }

        /* LED 메트로놈 */
        #led-row { display: flex; gap: 15px; margin: 10px 0; }
        .led { width: 60px; height: 10px; background: #444; border-radius: 5px; }
        .led.active { background: #00ff00; box-shadow: 0 0 15px #00ff00; }

        /* 악보 및 스크롤 바 */
        #score-wrapper { 
            position: relative; width: 95%; max-width: 1300px; 
            background: white; margin: 20px; padding: 40px; 
            border-radius: 15px; min-height: 500px; overflow: hidden;
        }
        
        /* 세로 스크롤 (Playhead) */
        #playhead {
            position: absolute; top: 0; left: 50px; width: 3px; height: 100%;
            background: rgba(255, 0, 0, 0.6); z-index: 10;
            display: none; transition: left 0.1s linear;
        }
    </style>
</head>
<body>

    <div id="watermark">SONG, YOUNG-MIN Guitar Lab</div>

    <header>
        <h1>Live Recording Score</h1>
        <div class="settings">
            <span>BPM: <input type="number" id="bpm-input" value="80" style="width:70px;"></span>
            <span>박자: 
                <select id="time-sig">
                    <option value="4/4">4/4</option>
                    <option value="3/4">3/4</option>
                </select>
            </span>
        </div>
        <div id="led-row"></div>
        <div class="main-controls">
            <button id="rec-btn" class="big-btn" onclick="startRecording()">RECORD</button>
            <button id="pause-btn" class="big-btn" onclick="pauseRecording()">PAUSE</button>
            <button id="del-btn" class="big-btn" onclick="deleteLast()">지우기 (←)</button>
        </div>
    </header>

    <div id="score-wrapper">
        <div id="playhead"></div>
        <div id="score-render-area"></div>
    </div>

    <script>
        let audioCtx, analyser, isRecording = false;
        let bpm, beatSec, timeSig = 4;
        let recordedNotes = [];
        let startTime, currentLine = 0;
        const noteNames = ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B"];

        function setupLEDs() {
            const row = document.getElementById('led-row');
            row.innerHTML = '';
            timeSig = parseInt(document.getElementById('time-sig').value.split('/')[0]);
            for(let i=0; i<timeSig; i++) {
                const led = document.createElement('div');
                led.className = 'led';
                row.appendChild(led);
            }
        }
        setupLEDs();
        document.getElementById('time-sig').onchange = setupLEDs;

        async function startRecording() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                audioCtx.createMediaStreamSource(stream).connect(analyser = audioCtx.createAnalyser());
            }
            
            bpm = document.getElementById('bpm-input').value;
            beatSec = 60 / bpm;
            isRecording = true;
            
            document.getElementById('rec-btn').style.display = 'none';
            document.getElementById('pause-btn').style.display = 'inline-block';
            document.getElementById('playhead').style.display = 'block';

            // 녹음 시작 시간 고정 (예비박 없이 즉시 혹은 타이밍 동기화)
            startTime = audioCtx.currentTime;
            requestAnimationFrame(updateLoop);
        }

        function pauseRecording() {
            isRecording = false;
            document.getElementById('rec-btn').innerText = "RESUME";
            document.getElementById('rec-btn').style.display = 'inline-block';
            document.getElementById('pause-btn').style.display = 'none';
        }

        let lastPitch = -1;
        let noteStartBeat = 0;

        function updateLoop() {
            if (!isRecording) return;

            const now = audioCtx.currentTime - startTime;
            const currentBeat = now / beatSec;
            
            // 1. 세로 스크롤(Playhead) 위치 업데이트
            updatePlayhead(currentBeat);

            // 2. LED 업데이트
            const beatInMeasure = Math.floor(currentBeat) % timeSig;
            const leds = document.querySelectorAll('.led');
            leds.forEach((l, i) => l.classList.toggle('active', i === beatInMeasure));

            // 3. 음높이 분석
            const buffer = new Float32Array(analyser.fftSize);
            analyser.getFloatTimeDomainData(buffer);
            const freq = autoCorrelate(buffer, audioCtx.sampleRate);

            if (freq !== -1) {
                const pitch = getNoteFromFreq(freq);
                const pitchId = pitch.key + pitch.octave;
                
                if (lastPitch === -1) {
                    // 음 시작 - 퀀타이즈: 가장 가까운 16분음표(0.25박) 지점으로 고정
                    noteStartBeat = Math.round(currentBeat * 4) / 4;
                    lastPitch = pitch;
                }
            } else if (lastPitch !== -1) {
                // 음 종료 - 퀀타이즈된 길이 계산
                const noteEndBeat = Math.round(currentBeat * 4) / 4;
                let durationBeats = noteEndBeat - noteStartBeat;
                
                if (durationBeats >= 0.25) {
                    addNote(lastPitch, noteStartBeat, durationBeats);
                }
                lastPitch = -1;
            }

            requestAnimationFrame(updateLoop);
        }

        function updatePlayhead(beat) {
            const head = document.getElementById('playhead');
            const measureWidth = 280; // 마디 너비
            const measuresPerLine = 4;
            
            const currentMeasure = Math.floor(beat / timeSig);
            const beatInMeasure = beat % timeSig;
            
            const line = Math.floor(currentMeasure / measuresPerLine);
            const col = currentMeasure % measuresPerLine;
            
            // 스크롤 위치 계산
            const xPos = 50 + (col * measureWidth) + (beatInMeasure / timeSig * measureWidth);
            const yPos = line * 200;
            
            head.style.left = `${xPos}px`;
            head.style.top = `${yPos}px`;
            head.style.height = `200px`; // 현재 줄 높이만큼만 표시
        }

        function addNote(pitch, startBeat, duration) {
            // 박자 형태 결정 (1.0=q, 0.5=8, 0.25=16)
            let type = "q";
            if (duration <= 0.3) type = "16";
            else if (duration <= 0.7) type = "8";
            else if (duration <= 1.2) type = "q";
            else type = "h"; // 2박 이상

            recordedNotes.push({ ...pitch, startBeat, type, duration });
            drawScore();
        }

        function deleteLast() {
            recordedNotes.pop();
            drawScore();
        }

        window.addEventListener('keydown', e => { if(e.key === "ArrowLeft") deleteLast(); });

        function drawScore() {
            const area = document.getElementById('score-render-area');
            area.innerHTML = "";
            const VF = Vex.Flow;
            const renderer = new VF.Renderer(area, VF.Renderer.Backends.SVG);
            
            // 마디별 데이터 분리
            let measures = [];
            recordedNotes.forEach(n => {
                const mIdx = Math.floor(n.startBeat / timeSig);
                if(!measures[mIdx]) measures[mIdx] = [];
                measures[mIdx].push(n);
            });

            const measuresPerLine = 4;
            const totalMeasures = Math.max(measures.length, Math.floor((audioCtx ? (audioCtx.currentTime - startTime) / beatSec / timeSig : 0)) + 1);
            const totalRows = Math.ceil(totalMeasures / measuresPerLine);
            
            renderer.resize(1200, totalRows * 200 + 50);
            const ctx = renderer.getContext();

            for (let i = 0; i < totalMeasures; i++) {
                const row = Math.floor(i / measuresPerLine);
                const col = i % measuresPerLine;
                const stave = new VF.Stave(col * 280 + 50, row * 200 + 40, 280);
                if (col === 0) stave.addClef("treble");
                if (i === 0) stave.addTimeSignature(document.getElementById('time-sig').value);
                stave.setContext(ctx).draw();

                if (measures[i]) {
                    const vfNotes = measures[i].map(d => {
                        const sn = new VF.StaveNote({ keys: [`${d.key}/${d.octave}`], duration: d.type });
                        if (d.accidental) sn.addModifier(new VF.Accidental(d.accidental));
                        return sn;
                    });
                    const voice = new VF.Voice({ num_beats: timeSig, beat_value: 4 }).setStrict(false);
                    voice.addTickables(vfNotes);
                    new VF.Formatter().joinVoices([voice]).format([voice], 200);
                    voice.draw(ctx, stave);
                }
            }
        }

        // --- 분석 엔진 ---
        function getNoteFromFreq(freq) {
            const num = 12 * (Math.log2(freq / 440)) + 69;
            const rnd = Math.round(num);
            return { key: noteNames[rnd % 12].replace('#',''), octave: Math.floor(rnd / 12), accidental: noteNames[rnd % 12].includes('#') ? '#' : null };
        }

        function autoCorrelate(buf, sampleRate) {
            let rms = 0; for (let i=0; i<buf.length; i++) rms += buf[i]*buf[i];
            if (Math.sqrt(rms/buf.length) < 0.02) return -1;
            let c = new Array(buf.length).fill(0);
            for (let i=0; i<buf.length; i++) for (let j=0; j<buf.length-i; j++) c[i] = c[i] + buf[j]*buf[j+i];
            let d=0; while (c[d]>c[d+1]) d++;
            let maxv=-1, maxp=-1;
            for (let i=d; i<buf.length; i++) if (c[i] > maxv) { maxv = c[i]; maxp = i; }
            return sampleRate/maxp;
        }
    </script>
</body>
</html>
