<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SYMGuitarLab Live Score</title>
    <script src="https://cdn.jsdelivr.net/npm/vexflow@4.2.2/build/cjs/vexflow.js"></script>
    <style>
        :root { --navy: #000080; --red: #c0392b; --orange: #ff8c00; --lime: #32cd32; }
        body { font-family: sans-serif; margin: 0; background: #ffffff; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        
        header { width: 100%; padding: 8px 0; text-align: center; border-bottom: 1px solid #eee; flex-shrink: 0; }
        #status { font-weight: bold; color: var(--red); font-size: 0.85rem; }

        /* 악보 컨테이너: 마디 간격(행간) 최소화 */
        #score-wrapper { 
            position: relative; flex: 1; width: 100%; background: white; 
            overflow-y: auto; overflow-x: hidden; padding-top: 5px;
        }
        
        /* 1. 플레이헤드 자체가 LED 역할 (박자에 따라 색상 변경) */
        #playhead { 
            position: absolute; width: 3px; height: 80px; 
            background: #ddd; z-index: 50; display: none; 
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            transition: background 0.05s, box-shadow 0.05s;
        }
        #playhead.first-beat { background: var(--orange) !important; box-shadow: 0 0 15px var(--orange); }
        #playhead.other-beat { background: var(--lime) !important; box-shadow: 0 0 15px var(--lime); }

        /* 5. 버튼 크기 축소 및 하단 배치 */
        .bottom-controls { 
            display: flex; gap: 8px; padding: 10px; background: #f8f9fa; 
            border-top: 1px solid #ddd; padding-bottom: calc(10px + env(safe-area-inset-bottom));
        }
        .small-btn { flex: 1; padding: 12px 0; font-size: 0.9rem; font-weight: bold; border: none; border-radius: 8px; color: white; cursor: pointer; }
        #rec-btn { background: var(--navy); }
        #stop-btn { background: var(--red); display: none; }
        #del-btn { background: #777; flex: 0 0 60px; }

        footer { padding: 5px 0; text-align: center; background: white; }
        #watermark { font-size: 0.9rem; font-weight: 900; color: rgba(0,0,0,0.1); }
    </style>
</head>
<body>

    <header>
        <div id="status">READY</div>
        <div style="font-size:0.75rem; color:#999;">BPM <input type="number" id="bpm-input" value="80" style="width:35px; border:none; border-bottom:1px solid #ccc;"></div>
    </header>

    <div id="score-wrapper">
        <div id="playhead"></div>
        <div id="score-render-area"></div>
    </div>

    <div class="bottom-controls">
        <button id="del-btn" class="small-btn" onclick="deleteLast()">지우기</button>
        <button id="rec-btn" class="small-btn" onclick="startRecording()">RECORD</button>
        <button id="stop-btn" class="small-btn" onclick="stopRecording()">STOP</button>
    </div>

    <footer>
        <div id="watermark">SONG, YOUNG-MIN Guitar Lab</div>
    </footer>

    <script>
        let audioCtx, analyser, isRecording = false;
        let bpm, beatSec, timeSig = 4;
        let recordedNotes = [];
        let startTime, preCountActive = false;
        let recognition;
        const noteNames = ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B"];
        
        let lastTranscript = ""; // 실시간 가사 보관

        // 초기 음성인식 엔진 (AMDF)
        function getPitch(buf, sampleRate) {
            let sum = 0; for (let i=0; i<buf.length; i++) sum += buf[i]*buf[i];
            if (Math.sqrt(sum/buf.length) < 0.015) return -1;
            let bestOffset = -1, bestCorrelation = 0;
            for (let offset = 20; offset < 500; offset++) {
                let correlation = 0;
                for (let i=0; i<buf.length-offset; i++) correlation += Math.abs(buf[i]-buf[i+offset]);
                correlation = 1 - (correlation/buf.length);
                if (correlation > bestCorrelation) { bestCorrelation = correlation; bestOffset = offset; }
            }
            return (bestCorrelation > 0.9) ? sampleRate/bestOffset : -1;
        }

        // 한국어 음성 인식 (가사 즉시 반영용)
        function setupSpeech() {
            const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (SpeechRec) {
                recognition = new SpeechRec();
                recognition.continuous = true;
                recognition.interimResults = true;
                recognition.lang = 'ko-KR';
                recognition.onresult = (e) => {
                    let text = '';
                    for (let i = e.resultIndex; i < e.results.length; i++) {
                        text = e.results[i][0].transcript;
                    }
                    lastTranscript = text.split(' ').pop(); // 마지막 단어 추출
                };
            }
        }

        async function startRecording() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                analyser = audioCtx.createAnalyser();
                analyser.fftSize = 2048;
                audioCtx.createMediaStreamSource(stream).connect(analyser);
            }
            setupSpeech();
            bpm = document.getElementById('bpm-input').value;
            beatSec = 60 / bpm;
            isRecording = true; preCountActive = true;
            document.getElementById('rec-btn').style.display = 'none';
            document.getElementById('stop-btn').style.display = 'inline-block';
            document.getElementById('playhead').style.display = 'block';
            if(recognition) recognition.start();
            startTime = audioCtx.currentTime;
            updateLoop();
        }

        function stopRecording() {
            isRecording = false;
            if(recognition) recognition.stop();
            document.getElementById('rec-btn').style.display = 'inline-block';
            document.getElementById('stop-btn').style.display = 'none';
        }

        function updateLoop() {
            if (!isRecording) return;
            const elapsed = audioCtx.currentTime - startTime;
            const totalBeats = elapsed / beatSec;
            
            if (preCountActive) {
                document.getElementById('status').innerText = `READY: ${Math.floor(totalBeats)+1}`;
                movePlayhead(0, totalBeats);
                if (totalBeats >= timeSig) {
                    preCountActive = false; startTime = audioCtx.currentTime;
                    document.getElementById('status').innerText = "RECORDING";
                }
            } else {
                movePlayhead(totalBeats, totalBeats);
                detectPitch(totalBeats);
            }
            requestAnimationFrame(updateLoop);
        }

        // 1. 플레이헤드 위치 및 LED 통합
        function movePlayhead(beat, actualBeat) {
            const head = document.getElementById('playhead');
            const mIdx = Math.floor(beat / timeSig);
            const line = Math.floor(mIdx / 4);
            const col = mIdx % 4;
            const step = (window.innerWidth * 0.98) / 4;
            
            head.style.left = `${15 + (col * step) + ((beat % timeSig) / timeSig * step)}px`;
            head.style.top = `${20 + (line * 110)}px`; // 3. 행간 간격 줄임

            // 박자 LED 색상 변경
            const bDec = actualBeat % 1;
            const bInt = Math.floor(actualBeat % timeSig);
            if (bDec < 0.25) {
                head.className = (bInt === 0) ? 'first-beat' : 'other-beat';
            } else {
                head.className = '';
            }
        }

        let lastNoteName = "", noteStart = 0;
        function detectPitch(currentBeat) {
            const buffer = new Float32Array(analyser.fftSize);
            analyser.getFloatTimeDomainData(buffer);
            const freq = getPitch(buffer, audioCtx.sampleRate);

            if (freq !== -1) {
                const num = 12 * (Math.log2(freq / 440)) + 69;
                const rnd = Math.round(num);
                let oct = Math.floor(rnd / 12) - 1;
                if (oct < 4) oct += 1;
                const name = noteNames[rnd % 12].replace('#','') + oct;
                
                if (lastNoteName === "") {
                    noteStart = Math.round(currentBeat * 2) / 2;
                    lastNoteName = name;
                }
            } else if (lastNoteName !== "") {
                const duration = Math.round(currentBeat * 2) / 2 - noteStart;
                if (duration >= 0.5) {
                    const key = lastNoteName.slice(0, -1);
                    const oct = parseInt(lastNoteName.slice(-1));
                    
                    // 4. 가사는 음표가 생성될 때 즉시 할당
                    recordedNotes.push({ 
                        key, octave: oct, 
                        accidental: key.includes('#') ? '#' : null,
                        startBeat: noteStart, 
                        type: (duration < 0.75 ? "8" : "q"),
                        lyric: lastTranscript // 현재 인식된 단어 즉시 반영
                    });
                    lastTranscript = ""; // 사용 후 초기화
                    drawScore();
                }
                lastNoteName = "";
            }
        }

        function drawScore() {
            const area = document.getElementById('score-render-area');
            area.innerHTML = "";
            const VF = Vex.Flow;
            const renderer = new VF.Renderer(area, VF.Renderer.Backends.SVG);
            let measures = [];
            recordedNotes.forEach(n => {
                const mIdx = Math.floor(n.startBeat / timeSig);
                if(!measures[mIdx]) measures[mIdx] = [];
                measures[mIdx].push(n);
            });
            const totalM = Math.max(measures.length, Math.floor(((isRecording? (audioCtx.currentTime-startTime)/beatSec : 0)/timeSig))+1);
            const rows = Math.ceil(totalM / 4);
            const step = (window.innerWidth * 0.98) / 4;
            
            renderer.resize(window.innerWidth, rows * 110 + 40); // 3. 전체 높이 줄임
            const ctx = renderer.getContext();
            ctx.scale(0.7, 0.7); // 2. 음표를 더 작게 스케일 조정

            for (let i = 0; i < totalM; i++) {
                const r = Math.floor(i / 4), c = i % 4;
                const sW = step / 0.7;
                const stave = new VF.Stave(c * sW + 20, r * (110/0.7) + 20, sW);
                if (c === 0) stave.addClef("treble");
                stave.setContext(ctx).draw();

                if (measures[i]) {
                    const notes = measures[i].map(d => {
                        const sn = new VF.StaveNote({ keys: [`${d.key}/${d.octave}`], duration: d.type });
                        if (d.accidental) sn.addModifier(new VF.Accidental(d.accidental));
                        // 계이름
                        sn.addModifier(new VF.Annotation(d.key).setVerticalJustification(VF.Annotation.VerticalJustify.TOP));
                        // 4. 가사 즉시 기입
                        if (d.lyric) {
                            sn.addModifier(new VF.Annotation(d.lyric).setVerticalJustification(VF.Annotation.VerticalJustify.BOTTOM));
                        }
                        return sn;
                    });
                    const voice = new VF.Voice({ num_beats: 4, beat_value: 4 }).setStrict(false);
                    voice.addTickables(notes);
                    new VF.Formatter().joinVoices([voice]).format([voice], sW - 40);
                    voice.draw(ctx, stave);
                }
            }
        }

        function deleteLast() { recordedNotes.pop(); drawScore(); }
    </script>
</body>
</html>
