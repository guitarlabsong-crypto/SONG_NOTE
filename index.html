<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Aleatoric Universe - SONG, YOUNG-MIN</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: 'Courier New', monospace; touch-action: none; }
        #header {
            position: absolute; top: 0; width: 100%; height: 70px;
            background: rgba(0, 0, 0, 0.8); color: #0ff; display: flex;
            flex-direction: column; align-items: center; justify-content: center; z-index: 100;
            border-bottom: 1px solid #333;
        }
        #watermark { font-size: 10px; opacity: 0.7; margin-bottom: 8px; }
        .controls { display: flex; gap: 15px; }
        button {
            padding: 6px 12px; background: transparent; border: 1px solid #0ff;
            color: #0ff; border-radius: 4px; font-size: 11px; cursor: pointer;
            text-transform: uppercase;
        }
        button:active { background: #0ff; color: #000; }
        canvas { display: block; }
    </style>
</head>
<body>

<div id="header">
    <div id="watermark">SONG, YOUNG-MIN Guitar Lab | ALEATORIC SPACE</div>
    <div class="controls">
        <button onclick="spawnMeteor()">☄️ SPAWN METEOR</button>
        <button onclick="togglePause()">⏸ PAUSE</button>
    </div>
</div>

<canvas id="space"></canvas>

<script>
    const canvas = document.getElementById('space');
    const ctx = canvas.getContext('2d');
    const notes = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];
    const freqs = [261.63, 277.18, 293.66, 311.13, 329.63, 349.23, 369.99, 392.00, 415.30, 440.00, 466.16, 493.88];
    
    let meteors = [];
    let isPaused = false;
    let width, height;

    // --- Audio Setup (Reverb) ---
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const mainGain = audioCtx.createGain();
    const reverbNode = audioCtx.createConvolver();
    const delay = audioCtx.createDelay(0.5);
    const feedback = audioCtx.createGain();

    delay.delayTime.value = 0.3;
    feedback.gain.value = 0.4;
    delay.connect(feedback);
    feedback.connect(delay); // Echo loop

    mainGain.connect(delay);
    delay.connect(audioCtx.destination);
    mainGain.connect(audioCtx.destination);

    function playNote(index) {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        osc.type = 'triangle'; 
        osc.frequency.setValueAtTime(freqs[index], audioCtx.currentTime);
        g.gain.setValueAtTime(0.3, audioCtx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 2);
        osc.connect(g);
        g.connect(mainGain);
        osc.start();
        osc.stop(audioCtx.currentTime + 2);
    }

    // --- Physics: Triple Pendulum Meteor ---
    class TriplePendulumMeteor {
        constructor(x, y) {
            this.x = x; this.y = y;
            // 3개 마디의 각도와 각속도 (Chaos 파라미터)
            this.angles = [Math.random() * Math.PI, Math.random() * Math.PI, Math.random() * Math.PI];
            this.vAngles = [0, 0, 0];
            this.lengths = [20, 20, 20]; // 진자 마디 길이
            this.baseVel = { x: 0, y: 0 }; // 전체 이동 속도
            this.isDragging = false;
            this.history = [];
            this.hue = Math.random() * 360;
        }

        update() {
            if (isPaused || this.isDragging) return;

            // 3중 진자 알고리즘을 단순화한 카오스 운동 부여
            for(let i=0; i<3; i++) {
                this.vAngles[i] += (Math.random() - 0.5) * 0.02; // 무중력 속 미세 섭동
                this.angles[i] += this.vAngles[i];
            }

            this.x += this.baseVel.x;
            this.y += this.baseVel.y;

            // 벽 충돌 및 사운드 트리거
            if (this.x < 0 || this.x > width) {
                this.baseVel.x *= -1;
                playNote(Math.floor((this.y / height) * 12) % 12);
            }
            if (this.y < 70 || this.y > height) {
                this.baseVel.y *= -1;
                playNote(Math.floor((this.x / width) * 12) % 12);
            }

            this.history.push({x: this.x, y: this.y});
            if (this.history.length > 30) this.history.shift();
        }

        draw() {
            ctx.beginPath();
            ctx.shadowBlur = 15;
            ctx.shadowColor = `hsla(${this.hue}, 100%, 50%, 0.8)`;
            ctx.strokeStyle = `hsla(${this.hue}, 100%, 70%, 0.5)`;
            this.history.forEach((pos, i) => ctx.lineTo(pos.x, pos.y));
            ctx.stroke();

            // 3중 진자 시각화
            let curX = this.x, curY = this.y;
            ctx.strokeStyle = '#fff';
            ctx.beginPath();
            ctx.moveTo(curX, curY);
            for(let i=0; i<3; i++) {
                curX += Math.sin(this.angles[i]) * this.lengths[i];
                curY += Math.cos(this.angles[i]) * this.lengths[i];
                ctx.lineTo(curX, curY);
            }
            ctx.stroke();
            ctx.fillStyle = '#fff';
            ctx.arc(curX, curY, 4, 0, Math.PI*2);
            ctx.fill();
            ctx.shadowBlur = 0;
        }
    }

    function resize() {
        width = window.innerWidth;
        height = window.innerHeight;
        canvas.width = width;
        canvas.height = height;
    }

    function drawGrid() {
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.font = '10px Courier New';
        ctx.fillStyle = 'rgba(0, 255, 255, 0.15)';

        // 가로 벽 음계 표시 (상/하)
        for(let i=0; i<12; i++) {
            let x = (width / 12) * i + (width / 24);
            ctx.fillText(notes[i], x, 85);
            ctx.fillText(notes[i], x, height - 20);
        }
        // 세로 벽 음계 표시 (좌/우)
        for(let i=0; i<12; i++) {
            let y = ((height-70) / 12) * i + 70 + ((height-70) / 24);
            ctx.fillText(notes[i], 20, y);
            ctx.fillText(notes[i], width - 20, y);
        }
    }

    let currentMeteor = null;
    let touchStart = {x:0, y:0};

    canvas.addEventListener('touchstart', e => {
        const tx = e.touches[0].clientX;
        const ty = e.touches[0].clientY;
        // 클릭한 위치 근처의 유성 선택 혹은 생성 로직
        meteors.forEach(m => {
            if(Math.hypot(m.x - tx, m.y - ty) < 50) {
                currentMeteor = m;
                m.isDragging = true;
            }
        });
        touchStart = {x: tx, y: ty};
    });

    canvas.addEventListener('touchend', e => {
        if(currentMeteor) {
            const dx = e.changedTouches[0].clientX - touchStart.x;
            const dy = e.changedTouches[0].clientY - touchStart.y;
            currentMeteor.baseVel = { x: dx * 0.1, y: dy * 0.1 };
            currentMeteor.isDragging = false;
            currentMeteor = null;
        }
    });

    function spawnMeteor() {
        meteors.push(new TriplePendulumMeteor(width/2, height/2));
    }

    function togglePause() { isPaused = !isPaused; }

    function render() {
        ctx.fillStyle = 'rgba(0, 0, 0, 0.15)';
        ctx.fillRect(0, 0, width, height);
        drawGrid();
        meteors.forEach(m => {
            m.update();
            m.draw();
        });
        requestAnimationFrame(render);
    }

    window.addEventListener('resize', resize);
    resize();
    render();
</script>
</body>
</html>
