<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Live Score - SYMGuitarLab</title>
    <script src="https://cdn.jsdelivr.net/npm/vexflow@4.2.2/build/cjs/vexflow.js"></script>
    <style>
        :root { --navy: #000080; --red: #c0392b; --orange: #ff8c00; --lime: #32cd32; }
        body { font-family: sans-serif; margin: 0; background: #f0f2f5; display: flex; flex-direction: column; align-items: center; }
        
        header { width: 100%; background: white; padding: 15px 0; text-align: center; border-bottom: 1px solid #ddd; position: sticky; top: 0; z-index: 200; }
        .controls { display: flex; gap: 8px; justify-content: center; width: 95%; margin: 10px auto; }
        .big-btn { flex: 1; padding: 12px 0; font-size: 1rem; font-weight: bold; border: none; border-radius: 6px; cursor: pointer; color: white; }
        #rec-btn { background: var(--navy); }
        #stop-btn { background: var(--red); display: none; }
        #del-btn { background: #666; }
        
        #score-wrapper { 
            position: relative; width: 98%; background: white; margin: 5px auto; 
            border-radius: 4px; min-height: 450px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); overflow: hidden;
        }
        
        /* 플레이헤드: 오선지 높이에 딱 맞춤 */
        #playhead { position: absolute; width: 2.5px; height: 100px; background: rgba(255, 0, 0, 0.8); z-index: 50; display: none; }
        #follower-led { position: absolute; width: 16px; height: 16px; border-radius: 50%; top: -22px; left: -7px; border: 1px solid #ccc; }
        .first-beat { background: var(--orange) !important; box-shadow: 0 0 8px var(--orange); }
        .other-beat { background: var(--lime) !important; box-shadow: 0 0 8px var(--lime); }

        footer { width: 100%; padding: 40px 0; text-align: center; }
        #watermark-footer { font-size: 1.2rem; font-weight: 900; color: rgba(0,0,0,0.15); }
    </style>
</head>
<body>

    <header>
        <div id="status" style="font-weight:bold; color:var(--red); margin-bottom:5px;">READY</div>
        <div class="controls">
            <button id="rec-btn" class="big-btn" onclick="startRecording()">RECORD</button>
            <button id="stop-btn" class="big-btn" onclick="stopRecording()">STOP</button>
            <button id="del-btn" class="big-btn" onclick="deleteLast()">지우기</button>
        </div>
        <div style="font-size:0.8rem; color:#888;">BPM: <input type="number" id="bpm-input" value="80" style="width:40px;"> / 4마디 단위 정렬</div>
    </header>

    <div id="score-wrapper">
        <div id="playhead"><div id="follower-led"></div></div>
        <div id="score-render-area"></div>
    </div>

    <footer>
        <div id="watermark-footer">SONG, YOUNG-MIN Guitar Lab</div>
    </footer>

    <script>
        let audioCtx, analyser, isRecording = false;
        let bpm, beatSec, timeSig = 4;
        let recordedNotes = [];
        let startTime, preCountActive = false;
        const noteNames = ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B"];
        
        async function startRecording() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                analyser = audioCtx.createAnalyser();
                analyser.fftSize = 2048; 
                audioCtx.createMediaStreamSource(stream).connect(analyser);
            }
            bpm = document.getElementById('bpm-input').value;
            beatSec = 60 / bpm;
            isRecording = true; preCountActive = true;
            document.getElementById('rec-btn').style.display = 'none';
            document.getElementById('stop-btn').style.display = 'inline-block';
            document.getElementById('playhead').style.display = 'block';
            startTime = audioCtx.currentTime;
            updateLoop();
        }

        function stopRecording() {
            isRecording = false;
            document.getElementById('rec-btn').style.display = 'inline-block';
            document.getElementById('stop-btn').style.display = 'none';
        }

        function updateLoop() {
            if (!isRecording) return;
            const elapsed = audioCtx.currentTime - startTime;
            const totalBeats = elapsed / beatSec;
            
            if (preCountActive) {
                document.getElementById('status').innerText = `READY: ${Math.floor(totalBeats)+1}`;
                movePlayhead(0); 
                flashLED(totalBeats);
                if (totalBeats >= timeSig) {
                    preCountActive = false; startTime = audioCtx.currentTime;
                    document.getElementById('status').innerText = "REC ON";
                }
            } else {
                movePlayhead(totalBeats);
                flashLED(totalBeats);
                detectPitch(totalBeats);
            }
            requestAnimationFrame(updateLoop);
        }

        function movePlayhead(beat) {
            const head = document.getElementById('playhead');
            const mIdx = Math.floor(beat / timeSig);
            const line = Math.floor(mIdx / 4);
            const col = mIdx % 4;
            const step = (window.innerWidth * 0.95) / 4;
            const x = 30 + (col * step) + ((beat % timeSig) / timeSig * step);
            const y = 45 + (line * 150);
            head.style.left = `${x}px`; head.style.top = `${y}px`;
        }

        function flashLED(beat) {
            const led = document.getElementById('follower-led');
            const bInt = Math.floor(beat % timeSig);
            if (beat % 1 < 0.2) {
                led.className = (bInt === 0) ? 'first-beat' : 'other-beat';
            } else { led.className = ''; }
        }

        let lastNoteName = "", noteStart = 0;
        function detectPitch(currentBeat) {
            const buffer = new Float32Array(analyser.fftSize);
            analyser.getFloatTimeDomainData(buffer);
            const freq = getPitch(buffer, audioCtx.sampleRate);

            if (freq !== -1) {
                const info = getNoteInfo(freq);
                const name = info.key + info.octave;
                if (lastNoteName === "") {
                    noteStart = Math.round(currentBeat * 2) / 2;
                    lastNoteName = name;
                }
            } else if (lastNoteName !== "") {
                const duration = Math.round(currentBeat * 2) / 2 - noteStart;
                if (duration >= 0.5) {
                    const info = getNoteInfoFromID(lastNoteName);
                    recordedNotes.push({ ...info, startBeat: noteStart, type: (duration < 0.75 ? "8" : "q") });
                    drawScore();
                }
                lastNoteName = "";
            }
        }

        // 초기 버전의 안정적인 주파수 추출 로직 복구
        function getPitch(buf, sampleRate) {
            let sum = 0; for (let i=0; i<buf.length; i++) sum += buf[i]*buf[i];
            if (Math.sqrt(sum/buf.length) < 0.02) return -1;
            
            let bestOffset = -1, bestCorrelation = 0;
            for (let offset = 20; offset < 500; offset++) {
                let correlation = 0;
                for (let i=0; i<buf.length-offset; i++) correlation += Math.abs(buf[i]-buf[i+offset]);
                correlation = 1 - (correlation/buf.length);
                if (correlation > bestCorrelation) {
                    bestCorrelation = correlation;
                    bestOffset = offset;
                }
            }
            return (bestCorrelation > 0.9) ? sampleRate/bestOffset : -1;
        }

        function getNoteInfo(freq) {
            const num = 12 * (Math.log2(freq / 440)) + 69;
            const rnd = Math.round(num);
            let oct = Math.floor(rnd / 12) - 1;
            if (oct < 4) oct += 1; // 보정
            return { key: noteNames[rnd % 12].replace('#',''), octave: oct, accidental: noteNames[rnd % 12].includes('#') ? '#' : null };
        }
        
        function getNoteInfoFromID(id) {
            const key = id.slice(0, -1);
            const oct = parseInt(id.slice(-1));
            return { key, octave: oct, accidental: key.includes('#') ? '#' : null };
        }

        function drawScore() {
            const area = document.getElementById('score-render-area');
            area.innerHTML = "";
            const VF = Vex.Flow;
            const renderer = new VF.Renderer(area, VF.Renderer.Backends.SVG);
            let measures = [];
            recordedNotes.forEach(n => {
                const mIdx = Math.floor(n.startBeat / timeSig);
                if(!measures[mIdx]) measures[mIdx] = [];
                measures[mIdx].push(n);
            });
            const totalM = Math.max(measures.length, Math.floor(((isRecording? (audioCtx.currentTime-startTime)/beatSec : 0)/timeSig))+1);
            const rows = Math.ceil(totalM / 4);
            const step = (window.innerWidth * 0.95) / 4;
            renderer.resize(window.innerWidth, rows * 150 + 50);
            const ctx = renderer.getContext();
            ctx.scale(0.8, 0.8);

            for (let i = 0; i < totalM; i++) {
                const r = Math.floor(i / 4), c = i % 4;
                const stave = new VF.Stave(c * step + 30, r * 150 + 40, step);
                if (c === 0) stave.addClef("treble");
                if (i === 0) stave.addTimeSignature("4/4");
                stave.setContext(ctx).draw();
                if (measures[i]) {
                    const notes = measures[i].map(d => {
                        const sn = new VF.StaveNote({ keys: [`${d.key}/${d.octave}`], duration: d.type })
                                         .addModifier(new VF.Annotation(d.key).setVerticalJustification(VF.Annotation.VerticalJustify.TOP));
                        if (d.accidental) sn.addModifier(new VF.Accidental(d.accidental));
                        return sn;
                    });
                    const voice = new VF.Voice({ num_beats: 4, beat_value: 4 }).setStrict(false);
                    voice.addTickables(notes);
                    new VF.Formatter().joinVoices([voice]).format([voice], step - 40);
                    voice.draw(ctx, stave);
                }
            }
        }

        function deleteLast() { recordedNotes.pop(); drawScore(); }
    </script>
</body>
</html>
