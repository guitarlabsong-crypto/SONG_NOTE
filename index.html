<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sing Song Write v12</title>
    <script src="https://cdn.jsdelivr.net/npm/vexflow@4.2.2/build/cjs/vexflow.js"></script>
    <style>
        :root { --navy: #000080; --red: #c0392b; --orange: #ff8c00; --lime: #32cd32; }
        body { font-family: sans-serif; margin: 0; background: #fff; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        
        header { width: 100%; padding: 8px 0; border-bottom: 1px solid #eee; flex-shrink: 0; display: flex; flex-direction: column; align-items: center; }
        .title-row { display: flex; align-items: center; gap: 10px; }
        h1 { font-size: 1rem; margin: 0; color: var(--navy); letter-spacing: -0.5px; }
        #status-display { font-weight: bold; color: var(--red); font-size: 0.85rem; min-width: 50px; text-align: center; }
        .settings { font-size: 0.75rem; color: #888; margin-top: 2px; }

        /* 2. 악보 크기 대폭 축소 및 4마디 최적화 */
        #score-wrapper { position: relative; flex: 1; width: 100%; background: white; overflow-y: auto; overflow-x: hidden; }
        
        /* 1, 5. 플레이헤드 (LED 통합형) */
        #playhead { 
            position: absolute; width: 2px; height: 55px; background: #ccc; z-index: 50; display: none;
            box-shadow: 0 0 8px rgba(0,0,0,0.1);
        }
        #playhead.first-beat { background: var(--orange) !important; box-shadow: 0 0 12px var(--orange); }
        #playhead.other-beat { background: var(--lime) !important; box-shadow: 0 0 12px var(--lime); }

        /* 4, 5. 하단 버튼 디자인 수정 */
        .bottom-controls { 
            display: flex; gap: 6px; padding: 10px; background: #f8f9fa; 
            border-top: 1px solid #ddd; padding-bottom: calc(10px + env(safe-area-inset-bottom));
        }
        .small-btn { flex: 1; padding: 12px 0; font-size: 0.8rem; font-weight: bold; border: none; border-radius: 6px; color: white; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.2; }
        #rec-btn { background: var(--navy); }
        #stop-btn { background: var(--red); display: none; }
        #play-btn { background: #27ae60; }
        /* 4. 지우기 버튼 특화 */
        #del-btn { background: #555; flex: 0 0 65px; }
        .del-sub { font-size: 0.6rem; font-weight: normal; opacity: 0.8; }

        footer { padding: 4px; text-align: center; font-size: 0.75rem; color: #ddd; font-weight: bold; }
    </style>
</head>
<body>

    <header>
        <div class="title-row">
            <h1>SING SONG Write</h1>
            <div id="status-display">READY</div>
        </div>
        <div class="settings">
            BPM <input type="number" id="bpm-input" value="80" style="width:32px; border:none; border-bottom:1px solid #ccc; text-align:center;">
            | 4 Measures
        </div>
    </header>

    <div id="score-wrapper">
        <div id="playhead"></div>
        <div id="score-render-area"></div>
    </div>

    <div class="bottom-controls">
        <button id="del-btn" class="small-btn" onclick="deleteLast()">
            <span>←</span><span class="del-sub">Del. 지우기</span>
        </button>
        <button id="rec-btn" class="small-btn" onclick="startRecording()">RECORD</button>
        <button id="stop-btn" class="small-btn" onclick="stopRecording()">STOP</button>
        <button id="play-btn" class="small-btn" onclick="playbackMelody()">PLAY</button>
    </div>

    <footer>SONG, YOUNG-MIN Guitar Lab</footer>

    <script>
        let audioCtx, analyser, isRecording = false, isPlaying = false;
        let bpm, beatSec, timeSig = 4;
        let recordedNotes = [];
        let startTime, recognition;
        const noteNames = ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B"];
        let lastTranscript = "";

        // 메트로놈 클릭 사운드 함수
        function playClick(isFirstBeat) {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.frequency.value = isFirstBeat ? 1000 : 800;
            osc.type = 'sine';
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.1);
            osc.connect(gain).connect(audioCtx.destination);
            osc.start(); osc.stop(audioCtx.currentTime + 0.1);
        }

        // 음성 인식 설정
        function setupSpeech() {
            const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (SpeechRec) {
                recognition = new SpeechRec();
                recognition.continuous = true;
                recognition.interimResults = true;
                recognition.lang = 'ko-KR';
                recognition.onresult = (e) => {
                    for (let i = e.resultIndex; i < e.results.length; i++) {
                        lastTranscript = e.results[i][0].transcript.trim().split(' ').pop();
                    }
                };
            }
        }

        // 1. 예비박자 4번 후 녹음 시작
        async function startRecording() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                analyser = audioCtx.createAnalyser();
                analyser.fftSize = 1024;
                audioCtx.createMediaStreamSource(stream).connect(analyser);
            }
            setupSpeech();
            bpm = document.getElementById('bpm-input').value;
            beatSec = 60 / bpm;
            
            document.getElementById('rec-btn').style.display = 'none';
            document.getElementById('stop-btn').style.display = 'inline-block';
            document.getElementById('playhead').style.display = 'block';
            
            let count = 0;
            const preInterval = setInterval(() => {
                playClick(count === 0);
                document.getElementById('status-display').innerText = `READY ${count + 1}`;
                updatePlayheadUI(0, count); // 예비박자 시 0번 위치에서 LED만 깜빡
                count++;
                if (count >= 4) {
                    clearInterval(preInterval);
                    isRecording = true;
                    if(recognition) recognition.start();
                    startTime = audioCtx.currentTime;
                    document.getElementById('status-display').innerText = "REC";
                    updateLoop();
                }
            }, beatSec * 1000);
        }

        function stopRecording() {
            isRecording = true; isPlaying = false; // 루프 중단용
            isRecording = false;
            if(recognition) recognition.stop();
            document.getElementById('rec-btn').style.display = 'inline-block';
            document.getElementById('stop-btn').style.display = 'none';
            document.getElementById('playhead').style.display = 'none';
            document.getElementById('status-display').innerText = "READY";
        }

        function updateLoop() {
            if (!isRecording) return;
            const totalBeats = (audioCtx.currentTime - startTime) / beatSec;
            updatePlayheadUI(totalBeats, totalBeats);
            detectPitch(totalBeats);
            requestAnimationFrame(updateLoop);
        }

        // 플레이헤드 위치 및 LED (박자 동기화)
        function updatePlayheadUI(beat, actualBeat) {
            const head = document.getElementById('playhead');
            const mIdx = Math.floor(beat / timeSig);
            const line = Math.floor(mIdx / 4);
            const col = mIdx % 4;
            const step = window.innerWidth / 4;
            
            head.style.left = `${(col * step) + ((beat % timeSig) / timeSig * step)}px`;
            head.style.top = `${15 + (line * 75)}px`; // 2. 행간 더 줄임

            const bDec = actualBeat % 1;
            if (bDec < 0.2) {
                head.className = (Math.floor(actualBeat % timeSig) === 0) ? 'first-beat' : 'other-beat';
            } else { head.className = ''; }
        }

        let lastNoteName = "", noteStart = 0;
        function detectPitch(currentBeat) {
            const buffer = new Float32Array(analyser.fftSize);
            analyser.getFloatTimeDomainData(buffer);
            const freq = getPitch(buffer, audioCtx.sampleRate);

            if (freq !== -1) {
                const info = getNoteInfo(freq);
                const name = info.key + info.octave;
                if (lastNoteName === "") {
                    noteStart = Math.round(currentBeat * 4) / 4;
                    lastNoteName = name;
                }
            } else if (lastNoteName !== "") {
                const duration = Math.round(currentBeat * 4) / 4 - noteStart;
                if (duration >= 0.25) {
                    const info = getNoteInfoFromID(lastNoteName);
                    // 3. 알파벳(Key) 제거, 가사(Lyric)만 유지
                    recordedNotes.push({ ...info, startBeat: noteStart, type: duration >= 0.7 ? "q" : "8", lyric: lastTranscript });
                    drawScore();
                    lastTranscript = "";
                }
                lastNoteName = "";
            }
        }

        // 5. 재생 시 플레이헤드 동기화
        function playbackMelody() {
            if (recordedNotes.length === 0 || isPlaying) return;
            isPlaying = true;
            const playStartTime = audioCtx.currentTime;
            document.getElementById('playhead').style.display = 'block';

            recordedNotes.forEach(n => {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                const freq = 440 * Math.pow(2, (getMidiNum(n) - 69) / 12);
                osc.frequency.value = freq;
                gain.gain.setValueAtTime(0.2, playStartTime + n.startBeat * beatSec);
                gain.gain.exponentialRampToValueAtTime(0.001, playStartTime + (n.startBeat + 0.4) * beatSec);
                osc.connect(gain).connect(audioCtx.destination);
                osc.start(playStartTime + n.startBeat * beatSec);
                osc.stop(playStartTime + (n.startBeat + 0.4) * beatSec);
            });

            function animPlay() {
                if (!isPlaying) return;
                const elapsedBeats = (audioCtx.currentTime - playStartTime) / beatSec;
                updatePlayheadUI(elapsedBeats, elapsedBeats);
                if (elapsedBeats > recordedNotes[recordedNotes.length-1].startBeat + 2) {
                    isPlaying = false;
                    document.getElementById('playhead').style.display = 'none';
                } else {
                    requestAnimationFrame(animPlay);
                }
            }
            animPlay();
        }

        function getMidiNum(n) {
            const idx = noteNames.indexOf(n.key + (n.accidental || ""));
            return (n.octave + 1) * 12 + idx;
        }

        function drawScore() {
            const area = document.getElementById('score-render-area');
            area.innerHTML = "";
            const VF = Vex.Flow;
            const renderer = new VF.Renderer(area, VF.Renderer.Backends.SVG);
            let measures = [];
            recordedNotes.forEach(n => {
                const mIdx = Math.floor(n.startBeat / timeSig);
                if(!measures[mIdx]) measures[mIdx] = [];
                measures[mIdx].push(n);
            });
            const totalM = Math.max(measures.length, 4);
            const rows = Math.ceil(totalM / 4);
            const areaWidth = window.innerWidth;
            const step = areaWidth / 4;

            renderer.resize(areaWidth, rows * 75 + 30);
            const ctx = renderer.getContext();
            ctx.scale(0.55, 0.55); // 2. 악보 크기 추가 축소

            for (let i = 0; i < totalM; i++) {
                const r = Math.floor(i / 4), c = i % 4;
                const sW = step / 0.55;
                const stave = new VF.Stave(c * sW, r * (75/0.55), sW);
                if (c === 0) stave.addClef("treble");
                stave.setContext(ctx).draw();

                if (measures[i]) {
                    const notes = measures[i].map(d => {
                        const sn = new VF.StaveNote({ keys: [`${d.key}/${d.octave}`], duration: d.type });
                        if (d.accidental) sn.addModifier(new VF.Accidental(d.accidental));
                        // 3. 알파벳 제거, 가사만 표시
                        if (d.lyric) sn.addModifier(new VF.Annotation(d.lyric).setVerticalJustification(VF.Annotation.VerticalJustify.BOTTOM));
                        return sn;
                    });
                    const voice = new VF.Voice({ num_beats: 4, beat_value: 4 }).setStrict(false);
                    voice.addTickables(notes);
                    new VF.Formatter().joinVoices([voice]).format([voice], sW - 15);
                    voice.draw(ctx, stave);
                }
            }
        }

        // --- 초기 버전 기반 피치 검출 로직 ---
        function getPitch(buf, sampleRate) {
            let sum = 0; for (let i=0; i<buf.length; i++) sum += buf[i]*buf[i];
            if (Math.sqrt(sum/buf.length) < 0.02) return -1;
            let bestOffset = -1, bestCorrelation = 0;
            for (let offset = 20; offset < 500; offset++) {
                let corr = 0;
                for (let i=0; i<buf.length-offset; i++) corr += Math.abs(buf[i]-buf[i+offset]);
                corr = 1 - (corr/buf.length);
                if (corr > bestCorrelation) { bestCorrelation = corr; bestOffset = offset; }
            }
            return (bestCorrelation > 0.85) ? sampleRate/bestOffset : -1;
        }

        function getNoteInfo(freq) {
            const num = 12 * (Math.log2(freq / 440)) + 69;
            const rnd = Math.round(num);
            let oct = Math.floor(rnd / 12) - 1;
            if (oct < 4) oct += 1;
            return { key: noteNames[rnd % 12].replace('#',''), octave: oct, accidental: noteNames[rnd % 12].includes('#') ? '#' : null };
        }

        function getNoteInfoFromID(id) {
            const key = id.slice(0, -1);
            const oct = parseInt(id.slice(-1));
            return { key, octave: oct, accidental: key.includes('#') ? '#' : null };
        }

        function deleteLast() { recordedNotes.pop(); drawScore(); }
    </script>
</body>
</html>
